name: Desplegar Worker

# Despliega owm-proxy-worker.js en Cloudflare cuando cambia en master.
# Requiere el secreto del repo CLOUDFLARE_API_TOKEN (permiso "Workers Scripts: Edit")
# y, si el token ve más de una cuenta, CLOUDFLARE_ACCOUNT_ID. Sin token, avisa y no hace nada.
# También sincroniza FIRMS_MAP_KEY como secreto del Worker.
on:
  push:
    branches: [master]
    paths:
      - owm-proxy-worker.js
      - wrangler.owm-proxy.toml
      - .github/workflows/worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - name: Sin token de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN; el Worker no se desplegó."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22 # Wrangler 4 necesita Node 22

      - name: Desplegar
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.0'
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.owm-proxy.toml

      # Paso propio: la opción "secrets" de wrangler-action no usa --config y guardaba la clave
      # en el Worker del sitio (puntos-criticos) en vez de owm-proxy.
      - name: Sincronizar FIRMS_MAP_KEY en owm-proxy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.FIRMS_MAP_KEY != ''
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$FIRMS_MAP_KEY" | npx --yes wrangler@4.151.0 secret put FIRMS_MAP_KEY --config wrangler.owm-proxy.toml

      - name: Comprobar /health
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          curl -fsS https://owm-proxy.gesstiapp.workers.dev/health | tee /dev/stderr | grep -q '"firms":true'
