name: Desplegar Worker

# Despliega owm-proxy-worker.js en Cloudflare cuando cambia en master.
# Requiere el secreto del repo CLOUDFLARE_API_TOKEN (permiso "Workers Scripts: Edit")
# y, si el token ve más de una cuenta, CLOUDFLARE_ACCOUNT_ID. Sin token, avisa y no hace nada.
# También sincroniza FIRMS_MAP_KEY como secreto del Worker.
on:
  push:
    branches: [master]
    paths:
      - owm-proxy-worker.js
      - wrangler.owm-proxy.toml
      - .github/workflows/worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Sin token de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN; el Worker no se desplegó."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Desplegar
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.owm-proxy.toml
          secrets: FIRMS_MAP_KEY
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

      - name: Comprobar /health
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          curl -fsS https://owm-proxy.gesstiapp.workers.dev/health | tee /dev/stderr | grep -q '"firms":true'
