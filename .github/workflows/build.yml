name: Build

# Verifica que el proyecto compile desde un clon limpio en cada push y PR.
# No despliega: la publicación a gh-pages la hacen los scripts actualizar*.py.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validar JSON de datos
        run: |
          for f in public/data/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "JSON inválido: $f"; exit 1; }
          done
