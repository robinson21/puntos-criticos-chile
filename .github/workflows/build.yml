name: Build

# Verifica que cada PR compile desde un clon limpio y que los JSON sean válidos.
# La publicación la hace publicar.yml al unir a master.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validar JSON de datos
        run: |
          for f in public/data/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "JSON inválido: $f"; exit 1; }
          done
