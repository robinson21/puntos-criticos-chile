name: Prueba incendios por eventos (temporal)
on:
  push:
    branches: [incendios-eventos]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 actualizar_incendios.py
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: incendios
          path: public/data/incendios.json
