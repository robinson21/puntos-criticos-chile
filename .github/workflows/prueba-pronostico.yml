name: Prueba pronóstico de lluvia (temporal)
on:
  push:
    branches: [pronostico-lluvia]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy eccodes eccodeslib
      - run: python3 actualizar_pronostico_lluvia.py
      - uses: actions/upload-artifact@v4
        with:
          name: pronostico
          path: public/data/pronostico_lluvia.json
